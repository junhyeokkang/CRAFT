[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-retrieval"
version = "0.1.0"
description = "CRAFT: channel-wise retrieval-augmented forecasting for multivariate time series"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["craft"]
